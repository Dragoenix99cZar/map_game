[package]
name = "map_game"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Add this missing crate here:
serde-wasm-bindgen = "0.6"

[profile.release]
# Optimizes for tiny .wasm binaries (strips symbols and optimizes for size)
opt-level = "s"
lto = true
